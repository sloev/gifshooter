<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/logo.gif" />
    <title>gifshooter</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Landing: pick a canvas to paint on, or present one -->
    <main id="landing" class="view" hidden>
      <img class="logo" src="/logo.gif" alt="gifshooter" />

      <section class="card">
        <h2>Paint</h2>
        <form id="join-form" class="row">
          <input id="join-code" type="text" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="code from the screen" maxlength="24" />
          <button type="submit">Join</button>
        </form>
        <button id="join-public" class="secondary">Join the public canvas</button>
      </section>

      <section class="card">
        <h2>Present</h2>
        <form id="present-form" class="row">
          <input id="present-name" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="code or room name" maxlength="24" />
          <button type="submit">Present</button>
        </form>
        <div id="present-hint" class="hint" aria-live="polite"></div>
        <button id="present-public" class="secondary">Present the public canvas</button>
      </section>
      <footer class="fine">made with <span id="made-with">❤️</span> by <a href="https://supernihil.github.io">supernihil.github.io</a></footer>
    </main>

    <!-- Present: the shared animated board -->
    <div id="present" class="view" hidden>
      <canvas id="board"></canvas>
      <header id="present-bar">
        <canvas id="qr"></canvas>
        <div id="present-code" class="code"></div>
        <div class="bar-meta">
          <div id="present-url" class="url"></div>
          <div id="present-peers" class="peers">0 painters</div>
        </div>
      </header>
    </div>

    <!-- Paint: fullscreen trackpad -->
    <div id="paint" class="view" hidden>
      <canvas id="pad"></canvas>
      <div id="paint-status" class="status">looking for the screen…</div>
      <button id="hold-exit" class="hold corner tl" aria-label="Hold 5 seconds to exit"><span>✕</span></button>
      <button id="hold-gif" class="hold corner tr" aria-label="Hold 5 seconds to pick a gif"><canvas id="gif-preview" width="96" height="96"></canvas></button>
      <div id="picker" hidden>
        <div class="picker-head">
          <span>Pick a gif</span>
          <button id="picker-close" class="secondary">Back</button>
        </div>
        <div id="picker-grid"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./logo.gif" />
    <title>gifshooter</title>
    <script type="module" crossorigin src="./assets/index-C-5x3cU5.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C5-nxohr.css">
  </head>
  <body>
    <!-- Landing: pick a canvas to paint on, or present one -->
    <main id="landing" class="view" hidden>
      <img class="logo" src="./logo.gif" alt="" />
      <h1>gifshooter</h1>

      <section class="card">
        <h2>Paint</h2>
        <form id="join-form" class="row">
          <input id="join-code" type="text" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="canvas code" maxlength="24" />
          <button type="submit">Join</button>
        </form>
        <button id="join-public" class="secondary">Join the public canvas</button>
      </section>

      <section class="card">
        <h2>Present</h2>
        <button id="present-new">New canvas with shortcode</button>
        <form id="present-form" class="row">
          <input id="present-name" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="room name" maxlength="24" />
          <button type="submit">Present named</button>
        </form>
        <button id="present-public" class="secondary">Present the public canvas</button>
      </section>
      <p class="fine">Peer-to-peer over WebRTC, signalled through public Nostr relays. No server of our own.</p>
    </main>

    <!-- Present: the shared animated board -->
    <div id="present" class="view" hidden>
      <canvas id="board"></canvas>
      <header id="present-bar">
        <canvas id="qr"></canvas>
        <div>
          <div class="code-label">canvas code</div>
          <div id="present-code" class="code"></div>
          <div id="present-url" class="url"></div>
        </div>
        <div id="present-peers" class="peers">0 painters</div>
      </header>
    </div>

    <!-- Paint: fullscreen trackpad -->
    <div id="paint" class="view" hidden>
      <canvas id="pad"></canvas>
      <div id="paint-status" class="status">looking for the screen…</div>
      <button id="hold-exit" class="hold corner tl" aria-label="Hold 5 seconds to exit"><span>✕</span></button>
      <button id="hold-gif" class="hold corner tr" aria-label="Hold 5 seconds to pick a gif"><canvas id="gif-preview" width="96" height="96"></canvas></button>
      <div id="picker" hidden>
        <div class="picker-head">
          <span>Pick a gif</span>
          <button id="picker-close" class="secondary">Back</button>
        </div>
        <div id="picker-grid"></div>
      </div>
    </div>

  </body>
</html>
